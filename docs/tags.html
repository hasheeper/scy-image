<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex">
    <title>Danbooru Tag 词典 · Scylla</title>
    <link rel="preload" href="./fonts/manrope/files/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./fonts/manrope/index.css">
    <link rel="stylesheet" href="./fonts/noto-sans-sc/index.css">
    <link rel="stylesheet" href="./fonts/jetbrains-mono/index.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./tags.css">
    <link rel="icon" type="image/png" href="./assets/scylla-icon-small.png">
  </head>
  <body class="tags-body">
    <svg class="sprite" aria-hidden="true">
      <defs>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 4 4" /></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5" /><path d="M15 6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15" /></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7" /></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6M19 5l-8 8" /><path d="M17 13v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4" /></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7.5h14M9.5 7.5V5.5h5v2M7 7.5l.8 11a1.5 1.5 0 0 0 1.5 1.4h5.4a1.5 1.5 0 0 0 1.5-1.4l.8-11" /></symbol>
        <symbol id="i-cart" viewBox="0 0 24 24"><path d="M4 5h2l1.5 9h9.8l1.7-6H7" /><circle cx="10" cy="18" r="1" /><circle cx="17" cy="18" r="1" /></symbol>
        <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7" /></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12h13" /><path d="m12 7 5 5-5 5" /><path d="M19.5 4.5v15" /></symbol>
      </defs>
    </svg>

    <header class="topbar tags-topbar">
      <a class="brand tags-brand" href="./index.html" aria-label="返回 Scylla Image">
        <img class="brand-mark" src="./assets/scylla-icon-small.png" width="128" height="128" alt="">
        <span class="brand-wordmark">
          <span class="brand-title">Scylla</span>
          <span class="brand-subtitle">TAGS</span>
        </span>
      </a>
      <a class="btn btn-quiet btn-sm tags-back" href="./index.html"><svg class="ico"><use href="#i-back" /></svg>返回生成器</a>
    </header>

    <main class="tags-main">
      <div class="tags-content">
        <section class="tags-hero">
          <p class="tags-kicker">DANBOORU TAG DICTIONARY</p>
          <h1>中文 / 英文 Tag 词典</h1>
          <p class="tags-lede">中文找词，英文确认，复制后直接用于 Prompt。</p>
          <form class="tags-search" id="tagSearchForm" role="search">
            <svg class="ico"><use href="#i-search" /></svg>
            <input id="tagSearch" type="search" autocomplete="off" spellcheck="false" placeholder="例如：蓝发 / blue hair" aria-label="搜索 Danbooru Tag">
            <button class="btn btn-primary" id="tagSearchButton" type="submit">搜索</button>
          </form>
          <div class="tags-filters" id="tagFilters" aria-label="Tag 类型筛选">
            <span class="tags-filter-label">类型</span>
            <button type="button" class="tag-filter" data-category="0" aria-pressed="true"><i class="tag-category-dot general"></i>通用</button>
            <button type="button" class="tag-filter" data-category="3" aria-pressed="true"><i class="tag-category-dot copyright"></i>作品</button>
            <button type="button" class="tag-filter" data-category="4" aria-pressed="true"><i class="tag-category-dot character"></i>角色</button>
            <button type="button" class="tag-filter" data-category="1" aria-pressed="false"><i class="tag-category-dot artist"></i>画师</button>
            <button type="button" class="tag-filter" data-category="5" aria-pressed="false"><i class="tag-category-dot meta"></i>元数据</button>
            <span class="tags-filter-sync">同步补全</span>
          </div>
        </section>

        <section class="tags-results" aria-busy="false">
          <div class="tags-results-head">
            <p id="tagStatus" role="status" aria-live="polite">输入关键词开始搜索</p>
            <span id="tagResultCount"></span>
          </div>
          <div class="tags-grid" id="tagResults"></div>
          <nav class="tag-pagination" id="tagPagination" aria-label="搜索结果分页" hidden>
            <button class="btn btn-quiet btn-sm" id="tagPrevPage" type="button"><svg class="ico"><use href="#i-back" /></svg>上一页</button>
            <span id="tagPageLabel">第 1 页</span>
            <button class="btn btn-quiet btn-sm" id="tagNextPage" type="button">下一页<svg class="ico"><use href="#i-next" /></svg></button>
          </nav>
        </section>

        <footer class="tags-foot">
          搜索词会发送到在线双语 Tag 服务；英文查询在需要时回退至 Danbooru 官方接口。
        </footer>
      </div>

      <aside class="tag-cart" id="tagCart" aria-label="Prompt Tag 组合">
        <header class="tag-cart-head">
          <div><strong>Prompt 组合</strong><span class="badge" id="tagCartCount">0</span></div>
          <button class="ibtn ibtn-xs tag-cart-close" id="tagCartClose" type="button" aria-label="关闭组合侧栏">
            <svg class="ico"><use href="#i-close" /></svg>
          </button>
        </header>
        <div class="tag-cart-list" id="tagCartList"></div>
        <p class="tag-cart-empty" id="tagCartEmpty">从搜索结果添加 Tag</p>
        <div class="tag-cart-preview" id="tagCartPreview" hidden>
          <span>组合预览</span>
          <code id="tagCartPrompt"></code>
        </div>
        <footer class="tag-cart-foot">
          <button class="btn btn-primary btn-sm tag-cart-apply" id="tagCartApply" type="button" disabled>
            <svg class="ico"><use href="#i-send" /></svg>应用到生成器
          </button>
          <div class="tag-cart-foot-row">
            <button class="btn btn-quiet btn-sm" id="tagCartClear" type="button" disabled>
              <svg class="ico"><use href="#i-trash" /></svg>清空
            </button>
            <button class="btn btn-quiet btn-sm" id="tagCartCopy" type="button" disabled>
              <svg class="ico"><use href="#i-copy" /></svg>复制
            </button>
          </div>
        </footer>
      </aside>
    </main>

    <button class="tag-cart-fab" id="tagCartOpen" type="button" aria-label="打开 Prompt 组合" aria-controls="tagCart" aria-expanded="false">
      <svg class="ico"><use href="#i-cart" /></svg><span id="tagCartFabCount">0</span>
    </button>
    <button class="tag-cart-backdrop" id="tagCartBackdrop" type="button" aria-label="关闭组合侧栏"></button>
    <div class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="./js/tags-page.js"></script>
  </body>
</html>
